events { }

http {
    upstream webservers {
        server webserver:{{ stabvest_port }}; 
    }

    server {
        listen 80;

        # Only allow access to the web endpoints from these hosts/ranges (vpn) to limit exposure
        location ^~ /web/ {
            {% for ip in stabvest_allow_ips_web %}
            allow {{ ip }};
            {% endfor %}
    
            deny all;
    
            proxy_pass http://webservers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Only allow access to the agent endpoints from these hosts/ranges (inscope) to limit exposure
        location ^~ /agent/ {
            {% for ip in stabvest_allow_ips_agent %}
            allow {{ ip }};
            {% endfor %}
    
            deny all;
    
            proxy_pass http://webservers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # No other authorized endpoints exist
        #location / {
        #    proxy_pass http://webservers;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #}
    }
}