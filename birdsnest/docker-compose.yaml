# log.txt must be present before running!

services:
  nginx:
    image: nginx:latest
    ports:
      #- "80:80"
      #- "443:443"
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert.pem:/etc/nginx/cert.pem:ro
      - ./key.pem:/etc/nginx/key.pem:ro
    depends_on:
      - webserver

  webserver:
    build:
      context: .
      dockerfile: Dockerfile-server
    volumes:
      - .:/app
    #ports:
    #  - "8001:80"
    #  - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_CONTEXT=SERVER
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      worker:
        condition: service_healthy
  
  worker:
    build:
      context: .
      dockerfile: Dockerfile-worker
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - APP_CONTEXT=WORKER
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker_ready"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 10s

  database:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: birdsnest
      POSTGRES_PASSWORD: birdsnestpwd
      POSTGRES_DB: birdsnestdb
    #expose:
    #  - "5432" 
    ports:
      - "5432:5432"
    volumes:
      #- pgdata:/var/lib/postgresql/data # <v18
      - pgdata:/var/lib/postgresql # >=v18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 2s
      retries: 5

# docker volume ls; docker volume rm birdsnest_pgdata; docker volume ls; 
volumes:
  pgdata: